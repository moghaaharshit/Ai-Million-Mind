function AdminTradeManage({ run, onClose, onDone }) {
  const [account, setAccount] = useState(null);
  const [accErr, setAccErr] = useState("");
  const [busy, setBusy] = useState("");
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const [settling, setSettling] = useState(false);
  const [settleAmt, setSettleAmt] = useState(String(Number(run.amount || 0)));

  useEffect(() => {
    const unsub = db
      .collection("users")
      .doc(run.uid)
      .onSnapshot(
        (snap) => {
          setAccount(
            snap.exists
              ? { uid: snap.id, ...snap.data() }
              : { uid: run.uid, name: run.name || "", email: run.email || "" }
          );
          setAccErr("");
        },
        () => {
          setAccount({ uid: run.uid, name: run.name || "", email: run.email || "" });
          setAccErr("Could not load this user's profile. The rules must allow the admin to read it.");
        }
      );
    return unsub;
  }, [run.uid]);

  const status = run.status || "waiting";
  const st = runStatusOf(run);
  const held = status === "settled" ? 0 : Number(run.amount || 0);

  async function startLive() {
    setErr("");
    setMsg("");
    setBusy("live");
    try {
      await db.collection("runs").doc(run.id).update({
        status: "live",
        liveAt: Date.now(),
        startedBy: (auth.currentUser && auth.currentUser.email) || ADMIN_EMAIL,
      });
      setMsg("Trade is live. The user's chart shows the green live status right away.");
      if (onDone) onDone(`Run #${run.no} is live.`);
    } catch (ex) {
      setErr("Could not start this trade. " + ((ex && ex.message) || "Please try again."));
    } finally {
      setBusy("");
    }
  }

  async function settle() {
    const amt = Number(settleAmt);
    if (!Number.isFinite(amt) || amt <= 0) {
      setErr("Enter a settle amount greater than zero.");
      return;
    }
    if (!account) {
      setErr("This user's wallet is still loading. Try again in a moment.");
      return;
    }
    setErr("");
    setMsg("");
    setBusy("settle");
    try {
      // Release the committed stake from the wallet and pay the settle amount in its place,
      // so the user's total moves by (settle - committed) and locked comes back to zero.
      const base = Number(account.balance || 0);
      const credit = Number(account.depositBalance || 0);
      let remaining = held;
      const takeCredit = Math.min(credit, remaining);
      remaining -= takeCredit;
      const nextCredit = credit - takeCredit;
      const nextBase = Math.max(base - remaining, 0) + amt;

      const batch = db.batch();
      batch.update(db.collection("runs").doc(run.id), {
        status: "settled",
        settleAmount: amt,
        settledAt: Date.now(),
        settledBy: (auth.currentUser && auth.currentUser.email) || ADMIN_EMAIL,
      });
      batch.update(db.collection("users").doc(run.uid), {
        balance: nextBase,
        depositBalance: nextCredit,
      });
      await batch.commit();
      setSettling(false);
      setMsg(`${inr(amt)} settled and paid into the user's wallet. Locked is clear.`);
      if (onDone) onDone(`Run #${run.no} settled. ${inr(amt)} paid to the user's wallet.`);
    } catch (ex) {
      setErr("Could not settle this trade. " + ((ex && ex.message) || "Please try again."));
    } finally {
      setBusy("");
    }
  }

  return (
    <AdminModal
      title={`Run #${run.no || "—"}`}
      subtitle={`${run.name || run.email || "User"} · ${inr(run.amount || 0)} committed`}
      wide
      onClose={onClose}
    >
      {accErr ? <p className="adm-msg bad">{accErr}</p> : null}
      {account ? <AdminUserView user={account} held={held} /> : <p className="db-muted">Loading this user's dashboard…</p>}

      <div className="adm-kv" style={{ marginTop: 18 }}>
        <div><span>Run</span><b>#{run.no || "—"}</b></div>
        <div><span>Committed</span><b>{inr(run.amount || 0)}</b></div>
        <div><span>Requested</span><b>{formatRunTime(run.startedAt)}</b></div>
        <div><span>Started (live)</span><b>{formatRunTime(run.liveAt)}</b></div>
        <div><span>Status</span><b>{st.label}</b></div>
        {status === "settled" ? <div><span>Settled at</span><b>{formatRunTime(run.settledAt)}</b></div> : null}
        {status === "settled" ? <div><span>Paid to wallet</span><b>{inr(run.settleAmount || 0)}</b></div> : null}
      </div>

      {msg ? <p className="adm-msg ok">{msg}</p> : null}
      {err ? <p className="adm-msg bad" role="alert">{err}</p> : null}

      {status === "waiting" ? (
        <div className="adm-foot">
          <button type="button" className="adm-btn" onClick={onClose} disabled={!!busy}>Close</button>
          <button type="button" className="db-btn db-btn-primary" onClick={startLive} disabled={!!busy}>
            {busy === "live" ? "Starting…" : "Start live"}
          </button>
        </div>
      ) : status === "live" ? (
        settling ? (
          <div style={{ marginTop: 18 }}>
            <div className="db-field">
              <label htmlFor="settle-amt">Settle amount paid to wallet (₹)</label>
              <input
                id="settle-amt"
                type="number"
                inputMode="decimal"
                value={settleAmt}
                onChange={(e) => setSettleAmt(e.target.value)}
                placeholder={String(Number(run.amount || 0))}
              />
              <small>
                {inr(run.amount || 0)} is released from locked, and the amount you enter is paid into the user's wallet.
              </small>
            </div>
            <div className="adm-foot">
              <button type="button" className="adm-btn" onClick={() => { setSettling(false); setErr(""); }} disabled={!!busy}>
                Back
              </button>
              <button type="button" className="db-btn db-btn-primary" onClick={settle} disabled={!!busy || !account}>
                {busy === "settle" ? "Settling…" : "Confirm settle"}
              </button>
            </div>
          </div>
        ) : (
          <div className="adm-foot">
            <button type="button" className="adm-btn" onClick={onClose} disabled={!!busy}>Close</button>
            <button type="button" className="db-btn db-btn-primary" onClick={() => setSettling(true)} disabled={!!busy}>
              Settle and pay to wallet
            </button>
          </div>
        )
      ) : (
        <div className="adm-foot" style={{ alignItems: "center", justifyContent: "space-between" }}>
          <span className={`db-pill${st.cls}`}>{inr(run.settleAmount || 0)} paid · Settled</span>
          <button type="button" className="adm-btn" onClick={onClose}>Close</button>
        </div>
      )}
    </AdminModal>
  );
}

function AdminPayments() {
  const { settings, loading, err: loadErr } = usePaymentSettings();
  const [file, setFile] = useState(null);
  const [preview, setPreview] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [msg, setMsg] = useState("");
  const inputId = "admin-qr-file";
  const currentQr = settings.qrUrl || PAYMENT_DEFAULT_QR;

  function pick(e) {
    const f = e.target.files && e.target.files[0];
    setErr("");
    setMsg("");
    if (!f) {
      setFile(null);
      setPreview("");
      return;
    }
    if (!/^image\//.test(f.type)) {
      setErr("Please choose an image file (PNG or JPG).");
      return;
    }
    if (f.size > 5 * 1024 * 1024) {
      setErr("Image must be smaller than 5 MB.");
      return;
    }
    setFile(f);
    setPreview(URL.createObjectURL(f));
  }

  async function save() {
    if (!file) {
      setErr("Choose a QR image first.");
      return;
    }
    setErr("");
    setMsg("");
    setBusy(true);
    try {
      const body = new FormData();
      body.append("file", file);
      body.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
      const res = await fetch(
        `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
        { method: "POST", body }
      );
      let data = {};
      try {
        data = await res.json();
      } catch (ex) {
        data = {};
      }
      if (!res.ok || !data.secure_url) {
        throw new Error((data && data.error && data.error.message) || "Cloudinary upload failed.");
      }
      await db.collection("settings").doc("payment").set(
        {
          qrUrl: data.secure_url,
          qrPublicId: data.public_id || "",
          updatedAt: Date.now(),
          updatedBy: (auth.currentUser && auth.currentUser.email) || ADMIN_EMAIL,
        },
        { merge: true }
      );
      setMsg("Payment QR updated. Every user's Add money form now shows this QR.");
      setFile(null);
      setPreview("");
      const inp = document.getElementById(inputId);
      if (inp) inp.value = "";
    } catch (ex) {
      setErr("Could not update the QR. " + ((ex && ex.message) || "Please try again."));
    } finally {
      setBusy(false);
    }
  }

  return (
    <>
      <div className="db-head">
        <div>
          <span className="db-badge">Admin</span>
          <h1 className="db-title">Payments</h1>
          <p className="db-sub">Upload the UPI QR that users see on the Add money form. This image is hosted on Cloudinary and shown on every deposit.</p>
        </div>
      </div>

      {loadErr ? <p className="adm-msg bad">{loadErr}</p> : null}
      {msg ? <p className="adm-msg ok">{msg}</p> : null}
      {err ? <p className="adm-msg bad" role="alert">{err}</p> : null}

      <div className="db-panel tight">
        <div className="db-panel-head">
          <h2>Current payment QR</h2>
          <span className="adm-count">{settings.qrUrl ? "Custom" : "Default image"}</span>
        </div>
        <div className="db-qr-wrap">
          <div className="db-qr">
            <img src={currentQr} alt="Current UPI payment QR" />
          </div>
          <p>
            {loading
              ? "Loading…"
              : settings.updatedAt
              ? `Last updated ${formatRunTime(settings.updatedAt)}${settings.updatedBy ? " by " + settings.updatedBy : ""}`
              : "This is the default QR image bundled with the site."}
          </p>
        </div>
      </div>

      <div className="db-panel tight">
        <div className="db-panel-head"><h2>Upload a new QR</h2></div>
        <div className="db-form-grid">
          <div className="db-field" style={{ gridColumn: "1 / -1" }}>
            <label htmlFor={inputId}>QR image (PNG or JPG, max 5 MB)</label>
            <input id={inputId} type="file" accept="image/*" onChange={pick} />
            <small>Uploaded to Cloudinary cloud “{CLOUDINARY_CLOUD_NAME}” with the unsigned preset “{CLOUDINARY_UPLOAD_PRESET}”, then saved to the site.</small>
          </div>
          {preview ? (
            <div className="db-field" style={{ gridColumn: "1 / -1" }}>
              <label>Preview</label>
              <div className="db-qr" style={{ width: 180 }}>
                <img src={preview} alt="Selected QR preview" />
              </div>
            </div>
          ) : null}
        </div>
        <div className="adm-foot">
          <button type="button" className="db-btn db-btn-primary" onClick={save} disabled={busy || !file}>
            {busy ? "Uploading…" : "Upload and save QR"}
          </button>
        </div>
        <p className="adm-note">
          Saving replaces the QR on every user's deposit screen immediately. Uploads are unsigned, so no Cloudinary API secret is stored in this page.
        </p>
      </div>
    </>
  );
}

function App() {
  const hash = useHashRoute();
  const [user, setUser] = useState(null);
  const [authReady, setAuthReady] = useState(false);

  // Restore the Firebase session on load and keep it in sync.
  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (fbUser) => {
      if (!fbUser) {
        setUser(null);
        setAuthReady(true);
        return;
      }
      try {
        if (await isDeletedAccount(fbUser.uid)) {
          await auth.signOut();
          setUser(null);
          setAuthReady(true);
          return;
        }
        const profile = await profileFromFirebaseUser(fbUser);
        setUser(profile);
      } catch (e) {
        setUser({
          uid: fbUser.uid,
          name: fbUser.displayName || "Trader",
          email: fbUser.email || "",
          mobile: "",
          role: "user",
        });
      } finally {
        setAuthReady(true);
      }
    });
    return unsub;
  }, []);
  const isSignup = hash === "#signup";
  const isSignin = hash === "#signin";
  const isSession = hash === "#session";
  const legalDoc = LEGAL_DOCS.some(([slug]) => `#${slug}` === hash) ? hash.slice(1) : null;
  const dashKey = hash.replace(/^#\/?/, "");
  const isDash = dashKey === "app" || dashKey.startsWith("app/");
  const dashPage = isDash ? (dashKey.split("/")[1] || "home") : null;
  const isAdminPage = dashKey === "admin" || dashKey.startsWith("admin/");
  const adminPage = isAdminPage ? (dashKey.split("/")[1] || "users") : null;
  useEffect(() => {
    if (isSignup || isSignin || isSession || legalDoc || isDash || isAdminPage) window.scrollTo(0, 0);
  }, [isSignup, isSignin, isSession, legalDoc, isDash, isAdminPage]);

  // Anchor links clicked on a legal page: land first, then scroll to the section.
  useEffect(() => {
    if (isSignup || isSignin || isSession || legalDoc || isDash || isAdminPage) return;
    if (!/^#[A-Za-z][\w-]*$/.test(hash) || hash === "#home") return;
    const el = document.querySelector(hash);
    if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
  }, [hash, isSignup, isSignin, isSession, legalDoc, isDash, isAdminPage]);

  if (isSignup || isSignin || isSession) {
    return (
      <div className="app">
        {isSignup ? <Signup onAuth={setUser} /> : isSignin ? <Signin onAuth={setUser} /> : <Session />}
        <WaButton />
      </div>
    );
  }

  if (isAdminPage) {
    if (!authReady) {
      return <div className="app" style={{ minHeight: "100vh" }} />;
    }
    if (!user) {
      return (
        <div className="app">
          <Signin onAuth={setUser} />
          <WaButton />
        </div>
      );
    }
    if (!isAdminUser(user)) {
      return (
        <div className="app" style={{ minHeight: "100vh", display: "grid", placeItems: "center", padding: 24 }}>
          <div className="auth-card" style={{ maxWidth: 430, textAlign: "center" }}>
            <span className="badge">Admin only</span>
            <h2>Admins only</h2>
            <p className="auth-sub" style={{ marginLeft: "auto", marginRight: "auto" }}>
              This account does not have admin access. Ask an existing admin to change your user type.
            </p>
            <a href="#app" className="auth-submit" style={{ display: "grid", placeItems: "center", marginTop: 0, textDecoration: "none" }}>
              Back to dashboard
            </a>
          </div>
        </div>
      );
    }
    return (
      <AdminPanel
        page={adminPage}
        user={user}
        onSignout={() => {
          auth.signOut().finally(() => {
            setUser(null);
            window.location.hash = "#signin";
          });
        }}
      />
    );
  }

  if (isDash) {
    if (!authReady) {
      return <div className="app" style={{ minHeight: "100vh" }} />;
    }
    if (!user) {
      return (
        <div className="app">
          <Signin onAuth={setUser} />
          <WaButton />
        </div>
      );
    }
    return (
      <Dashboard
        page={dashPage}
        user={user}
        onSignout={() => {
          auth.signOut().finally(() => {
            setUser(null);
            window.location.hash = "#signin";
          });
        }}
      />
    );
  }

  if (legalDoc) {
    return (
      <div className="app">
        <Nav />
        <Legal doc={legalDoc} />
        <Footer />
        <WaButton />
      </div>
    );
  }

  return (
    <div className="app">
      <Nav />
      <Hero />
      <StartPanel />
      <DashboardSection />
      <Trusted />
      <TrackRecord />
      <WhatWeDo />
      <Edge />
      <HowItWorks />
      <IntelligentTrading />
      <CommandCenter />
      <Strategies />
      <Why />
      <Security />
      <Pricing />
      <Transparency />
      <Faq />
      <Responsible />
      <FinalCta />
      <Footer />
      <WaButton />
    </div>
  );
}
